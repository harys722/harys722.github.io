<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Oops! The page you are looking for doesn't exist. However, you can view my all websites links here.">

    <!-- Google / Search Engine Tags -->

    <meta itemprop="description" content="Oops! The page you are looking for doesn't exist. However, you can view my all websites links here.">
    <meta itemprop="image" content="https://cdn.harys.is-a.dev/avatars/main.png">

    <meta name="twitter:title" content="404 - Page Not Found">
    <meta name="twitter:description" content="Oops! The page you are looking for doesn't exist. However, you can view my all websites links here.">
    <meta name="twitter:image" content="https://cdn.harys.is-a.dev/avatars/main.png">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    overflow-x: hidden;
    position: relative;
    background: radial-gradient(ellipse at center, #2d0e0e 0%, #1a0707 70%, #0f0303 100%);
  }

  /* Animated starfield background */
  .starfield {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -3;
  }

  .star {
    position: absolute;
    background: linear-gradient(45deg, #ff4444, #ff6666);
    border-radius: 50%;
    animation: twinkle 3s infinite ease-in-out;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  /* Floating particles */
  .particles {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -2;
    pointer-events: none;
  }

  .particle {
    position: absolute;
    background: linear-gradient(45deg, #ff4444, #ff6666, #ff8888);
    border-radius: 50%;
    animation: float 15s infinite linear;
    filter: blur(1px);
    box-shadow: 0 0 10px rgba(255, 68, 68, 0.6);
  }

  @keyframes float {
    0% {
      transform: translateY(100vh) rotate(0deg);
      opacity: 0;
    }
    10% {
      opacity: 1;
    }
    90% {
      opacity: 1;
    }
    100% {
      transform: translateY(-100vh) rotate(360deg);
      opacity: 0;
    }
  }

  /* Main container with glassmorphism */
  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px);
    border-radius: 30px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 60px 40px;
    box-shadow: 0 25px 80px rgba(0, 0, 0, 0.3);
    animation: containerGlow 4s ease-in-out infinite alternate;
    max-width: 90vw;
    max-height: 90vh;
    overflow-y: auto;
  }

  @keyframes containerGlow {
    0% { box-shadow: 0 25px 80px rgba(0, 0, 0, 0.3), 0 0 0 rgba(255, 68, 68, 0); }
    100% { box-shadow: 0 25px 80px rgba(0, 0, 0, 0.3), 0 0 60px rgba(255, 68, 68, 0.3); }
  }

  /* 404 Error display */
  .error-code {
    font-size: 120px;
    font-weight: 900;
    letter-spacing: 10px;
    text-align: center;
    margin-bottom: 20px;
    background: linear-gradient(45deg, #ff4444, #ff6666, #ff8888, #ffaaaa);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: holographicShimmer 4s ease-in-out infinite;
    text-shadow: 0 0 50px rgba(255, 68, 68, 0.8);
    position: relative;
  }

  .error-code::before {
    content: '404';
    position: absolute;
    top: 0;
    left: 0;
    background: linear-gradient(45deg, #ff4444, #ff6666, #ff8888, #ffaaaa);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: holographicShimmer 4s ease-in-out infinite 0.1s;
    filter: blur(3px);
    opacity: 0.5;
    z-index: -1;
  }

  /* Advanced loader with multiple orbits - modified for error state */
  .loader {
    position: relative;
    width: 200px;
    height: 200px;
    margin-bottom: 40px;
  }

  /* Central energy core - error state */
  .energy-core {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 60px;
    height: 60px;
    background: radial-gradient(circle, #ff4444 0%, #cc0000 50%, #990000 100%);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    animation: errorPulse 2s infinite ease-in-out;
    box-shadow: 
      0 0 30px rgba(255, 68, 68, 0.9),
      0 0 60px rgba(255, 68, 68, 0.5),
      inset 0 0 20px rgba(255, 255, 255, 0.3);
  }

  .energy-core::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 120%;
    height: 120%;
    background: radial-gradient(circle, transparent 40%, rgba(255, 68, 68, 0.15) 70%);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    animation: errorRing 3s infinite ease-in-out;
  }

  @keyframes errorPulse {
    0%, 100% { 
      transform: translate(-50%, -50%) scale(1);
      box-shadow: 
        0 0 30px rgba(255, 68, 68, 0.9),
        0 0 60px rgba(255, 68, 68, 0.5),
        inset 0 0 20px rgba(255, 255, 255, 0.3);
    }
    50% { 
      transform: translate(-50%, -50%) scale(1.2);
      box-shadow: 
        0 0 50px rgba(255, 68, 68, 1),
        0 0 100px rgba(255, 68, 68, 0.7),
        inset 0 0 30px rgba(255, 255, 255, 0.4);
    }
  }

  @keyframes errorRing {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
    50% { transform: translate(-50%, -50%) scale(1.8); opacity: 0.2; }
  }

  /* Broken orbital rings */
  .orbit-ring {
    position: absolute;
    top: 50%;
    left: 50%;
    border-radius: 50%;
    border: 2px dashed rgba(255, 68, 68, 0.6);
    animation: brokenRotate linear infinite;
  }

  .orbit-ring-1 {
    width: 120px;
    height: 120px;
    margin: -60px 0 0 -60px;
    animation-duration: 12s;
    border-style: dotted;
  }

  .orbit-ring-2 {
    width: 160px;
    height: 160px;
    margin: -80px 0 0 -80px;
    animation-duration: 18s;
    animation-direction: reverse;
    border-style: dashed;
  }

  @keyframes brokenRotate {
    0% { transform: rotate(0deg); opacity: 0.6; }
    25% { opacity: 0.3; }
    50% { transform: rotate(180deg); opacity: 0.8; }
    75% { opacity: 0.2; }
    100% { transform: rotate(360deg); opacity: 0.6; }
  }

  /* Holographic text effects */
  .message {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 2px;
    text-align: center;
    margin-bottom: 20px;
    background: linear-gradient(45deg, #ff4444, #ff6666, #ff8888, #ffaaaa);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: holographicShimmer 4s ease-in-out infinite;
    text-shadow: 0 0 30px rgba(255, 68, 68, 0.6);
    position: relative;
  }

  .message::before {
    content: attr(data-text);
    position: absolute;
    top: 0;
    left: 0;
    background: linear-gradient(45deg, #ff4444, #ff6666, #ff8888, #ffaaaa);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: holographicShimmer 4s ease-in-out infinite 0.1s;
    filter: blur(2px);
    opacity: 0.7;
    z-index: -1;
  }

  .subtitle {
    font-size: 16px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.8);
    text-align: center;
    margin-bottom: 30px;
    opacity: 0.9;
  }

  @keyframes holographicShimmer {
    0%, 100% { background-position: 0% 50%; }
    25% { background-position: 100% 50%; }
    50% { background-position: 50% 100%; }
    75% { background-position: 100% 0%; }
  }

  /* Websites section */
  .websites-section {
    width: 100%;
    margin-top: 30px;
  }

  .websites-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 1px;
    text-align: center;
    margin-bottom: 25px;
    background: linear-gradient(45deg, #ff4444, #ff6666, #ff8888, #ffaaaa);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: holographicShimmer 4s ease-in-out infinite;
    text-shadow: 0 0 20px rgba(255, 68, 68, 0.6);
  }

  .websites-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
  }

  .website-card {
    background: linear-gradient(135deg, rgba(255, 68, 68, 0.15), rgba(255, 102, 102, 0.15));
    border: 1px solid rgba(255, 68, 68, 0.4);
    border-radius: 20px;
    padding: 20px;
    backdrop-filter: blur(10px);
    color: #ffffff;
    text-decoration: none;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    display: block;
  }

  .website-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    transition: left 0.5s ease;
  }

  .website-card:hover::before {
    left: 100%;
  }

  .website-card:hover {
    transform: translateY(-3px);
    border-color: rgba(255, 68, 68, 0.8);
    box-shadow: 0 15px 40px rgba(255, 68, 68, 0.4);
  }

  .website-name {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 8px;
    background: linear-gradient(45deg, #ff6666, #ff8888, #ffaaaa);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: holographicShimmer 4s ease-in-out infinite;
  }

  .website-description {
    font-size: 14px;
    opacity: 0.9;
    line-height: 1.4;
  }

  /* Navigation buttons */
  .nav-buttons {
    display: flex;
    gap: 20px;
    margin-top: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .nav-button {
    background: linear-gradient(135deg, rgba(255, 68, 68, 0.2), rgba(255, 102, 102, 0.2));
    border: 2px solid rgba(255, 68, 68, 0.5);
    border-radius: 15px;
    padding: 12px 24px;
    color: #ffffff;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
    position: relative;
    overflow: hidden;
  }

  .nav-button::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    transition: left 0.5s ease;
  }

  .nav-button:hover {
    transform: translateY(-2px);
    border-color: rgba(255, 68, 68, 0.8);
    box-shadow: 0 10px 30px rgba(255, 68, 68, 0.4);
  }

  .nav-button:hover::before {
    left: 100%;
  }

  /* Futuristic info panel */
  .info-panel {
    background: linear-gradient(135deg, rgba(255, 68, 68, 0.15), rgba(255, 102, 102, 0.15));
    border: 1px solid rgba(255, 68, 68, 0.4);
    border-radius: 20px;
    padding: 25px 35px;
    backdrop-filter: blur(10px);
    color: #ffffff;
    font-size: 16px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(255, 68, 68, 0.3);
    animation: infoPanelGlow 3s ease-in-out infinite alternate;
    margin-top: 20px;
  }

  @keyframes infoPanelGlow {
    0% { 
      border-color: rgba(255, 68, 68, 0.4);
      box-shadow: 0 10px 30px rgba(255, 68, 68, 0.3);
    }
    100% { 
      border-color: rgba(255, 102, 102, 0.5);
      box-shadow: 0 10px 30px rgba(255, 102, 102, 0.4);
    }
  }

  .info-item {
    margin: 8px 0;
    font-weight: 500;
    opacity: 0.9;
  }

  .info-item strong {
    color: #ff6b6b;
    text-shadow: 0 0 10px rgba(255, 107, 107, 0.8);
  }

  /* Responsive design */
  @media (max-width: 768px) {
    .container {
      padding: 40px 25px;
      margin: 20px;
    }
    
    .error-code {
      font-size: 80px;
      letter-spacing: 5px;
    }
    
    .loader {
      width: 150px;
      height: 150px;
    }
    
    .energy-core {
      width: 40px;
      height: 40px;
    }
    
    .orbit-ring-1 { width: 90px; height: 90px; margin: -45px 0 0 -45px; }
    .orbit-ring-2 { width: 120px; height: 120px; margin: -60px 0 0 -60px; }
    
    .message {
      font-size: 20px;
      letter-spacing: 1px;
    }
    
    .websites-grid {
      grid-template-columns: 1fr;
    }
    
    .nav-buttons {
      flex-direction: column;
      align-items: center;
    }
    
    .nav-button {
      width: 200px;
      text-align: center;
    }
  }

  @media (max-width: 480px) {
    .container {
      padding: 30px 20px;
    }
    
    .error-code {
      font-size: 60px;
    }
    
    .loader {
      width: 120px;
      height: 120px;
    }
    
    .message {
      font-size: 18px;
    }
    
    .info-panel {
      padding: 20px 25px;
      font-size: 14px;
    }
  }
</style>
</head>
<body>

<!-- Animated starfield -->
<div class="starfield" id="starfield"></div>

<!-- Floating particles -->
<div class="particles" id="particles"></div>

<div class="container">
  <div class="error-code">404</div>
  
  <div class="loader">
    <!-- Energy core -->
    <div class="energy-core"></div>
    
    <!-- Broken orbital rings -->
    <div class="orbit-ring orbit-ring-1"></div>
    <div class="orbit-ring orbit-ring-2"></div>
  </div>
  
  <div class="message" data-text="Page Not Found">
    Page Not Found
  </div>
  
  <div class="subtitle">
    This page doesn't exist, but you can explore my other quantum realms below.<br>
    Each link opens in a new dimension (tab).
  </div>
  
  <div class="websites-section">
    <div class="websites-title">🌐 Explore My Other Websites</div>
    <div class="websites-grid" id="websitesGrid">
      <!-- Website cards will be populated by JavaScript -->
    </div>
  </div>
  
  <div class="nav-buttons">
    <a href="/" class="nav-button">🏠 Return to Home</a>
    <a href="javascript:history.back()" class="nav-button">⏪ Go Back</a>
  </div>
  
  <div class="info-panel">
    <div class="info-item">⚠️ <strong>Error Code:</strong> 404_NOT_FOUND</div>
    <div class="info-item">🔍 <strong>Status:</strong> Page Not Found</div>
    <div class="info-item" id="current-time"></div>
  </div>
</div>

<script>
  // Array of your websites - you can easily add/remove websites here
  const websites = [
    {
      name: "Website",
      url: "https://harys.is-a.dev/",
      description: "My personal website and projects showcase."
    },
    {
      name: "Free Domains",
      url: "/free-domains",
      description: "A curated collection of free domains that can be used in personal websites & projects."
    },
    {
      name: "Open API",
      url: "/open-api", 
      description: "A free Open API service that provides a variety of endpoints that you can use in your applications."
    },
    {
      name: "GitHub Guides",
      url: "/github-guides",
      description: "Learn more about GitHub & GitHub pages as a developer."
    },
    {
      name: "is-a.dev Prototype",
      url: "/is-a-dev-prototype",
      description: "A prototype of 'is-a.dev' which is a completely free subdomains service."
    },
    {
      name: "No One Is A Dev",
      url: "/no-one-is-a-dev",
      description: "Welcome to the world where developers don't exist, yet somehow this website was built."
    }
  ];

  // Create animated starfield
  function createStarfield() {
    const starfield = document.getElementById('starfield');
    const starCount = 100;
    
    for (let i = 0; i < starCount; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.width = star.style.height = Math.random() * 3 + 1 + 'px';
      star.style.animationDelay = Math.random() * 3 + 's';
      starfield.appendChild(star);
    }
  }

  // Create floating particles
  function createParticles() {
    const particlesContainer = document.getElementById('particles');
    const particleCount = 15;
    
    for (let i = 0; i < particleCount; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.width = particle.style.height = Math.random() * 4 + 2 + 'px';
      particle.style.animationDelay = Math.random() * 15 + 's';
      particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
      particlesContainer.appendChild(particle);
    }
  }

  // Function to create website cards
  function createWebsiteCards() {
    const grid = document.getElementById('websitesGrid');
    
    websites.forEach(website => {
      const card = document.createElement('a');
      card.className = 'website-card';
      card.href = website.url;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';
      
      card.innerHTML = `
        <div class="website-name">${website.name}</div>
        <div class="website-description">${website.description}</div>
      `;
      
      grid.appendChild(card);
    });
  }

  // Update time display
  function updateTime() {
    const now = new Date();
    const timeString = now.toLocaleTimeString([], { 
      hour: '2-digit', 
      minute: '2-digit', 
      second: '2-digit',
      hour12: false
    });
    
    document.getElementById('current-time').innerHTML = 
      `🕐 <strong>Your Local Time:</strong> ${timeString}`;
  }

  // Initialize everything
  createStarfield();
  createParticles();
  createWebsiteCards();
  updateTime();
  
  // Update time every second
  setInterval(updateTime, 1000);

  // Add mouse interaction effects
  document.addEventListener('mousemove', (e) => {
    const container = document.querySelector('.container');
    const rect = container.getBoundingClientRect();
    const x = e.clientX - rect.left - rect.width / 2;
    const y = e.clientY - rect.top - rect.height / 2;
    
    container.style.transform = `perspective(1000px) rotateY(${x * 0.05}deg) rotateX(${-y * 0.05}deg)`;
  });

  document.addEventListener('mouseleave', () => {
    const container = document.querySelector('.container');
    container.style.transform = 'perspective(1000px) rotateY(0deg) rotateX(0deg)';
  });

  // Add glitch effect on page load
  setTimeout(() => {
    document.querySelector('.error-code').style.animation += ', glitch 0.5s ease-in-out';
  }, 1000);
</script>

</body>
</html>
